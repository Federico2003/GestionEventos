name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Frontend - Build y Pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=packages/frontend
      - run: npm run build --workspace=packages/frontend

      - name: Pruebas unitarias (reporte JUnit)
        run: npx vitest run --project @planora/frontend
        env:
          VITEST_JUNIT_FILE: reports/frontend-junit.xml

      - name: Publicar reporte de pruebas
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Report - Frontend
          path: reports/frontend-junit.xml
          reporter: java-junit

  docker-hub:
    name: Frontend - Docker Hub
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/planora-web:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
            ${{ secrets.DOCKER_USERNAME }}/planora-web:sha-${{ github.sha }}

  deploy-dev:
    name: Frontend - Ambiente Dev
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_ENV: development
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy packages/frontend/dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main

  deploy-prod:
    name: Frontend - Ambiente Prod
    needs: [deploy-dev, docker-hub]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # Required reviewers: espera aprobación manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_ENV: production
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy packages/frontend/dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
