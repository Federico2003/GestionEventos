<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var saved = localStorage.getItem('planora-color-scheme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = saved;
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>PLANORA — Gestión Profesional de Eventos y Control Financiero</title>
  </head>
  <body class="antialiased min-h-screen flex flex-col">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
